name: iOS Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device-family: [iPhone, iPad]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode and Simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml --strict

      - name: Run XCUITest suite
        env:
          IOS_DEVICE_FAMILY: ${{ matrix.device-family }}
          CI_DIAGNOSTICS_DIR: ci-diagnostics/${{ matrix.device-family }}
        run: ./scripts/test-ios.sh

      - name: Collect iOS test diagnostics
        if: always()
        run: |
          mkdir -p ci-diagnostics
          xcodebuild -version > ci-diagnostics/xcode-version.txt
          xcodebuild -project CVee-resumebuilder.xcodeproj -scheme CVee-resumebuilder -showdestinations > ci-diagnostics/destinations.txt || true
          xcrun simctl list devices > ci-diagnostics/simulators.txt || true
          xcrun simctl list runtimes > ci-diagnostics/runtimes.txt || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ matrix.device-family }}
          path: |
            TestResults-*.xcresult
            ci-diagnostics
            .derivedData/Logs/Test
          if-no-files-found: warn
